<!doctype html>
<!-- Not working yet!!!-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Counter DApp</title>
</head>
<body>
  <h1>On-chain counter</h1>
  <p>Count: <span id="count">-</span></p>
  <button id="connect">Connect wallet</button>
  <button id="increment" disabled>Increment</button>
<!-- import { ethers } from "https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.min.js";-->
  <script type="module">
    import { ethers } from "./ethers.min.js";

    const CONTRACT_ADDRESS = "0xB5d97386143E1AA268202fa04fb74c1E9F9D3e77";
    const CONTRACT_ABI = [
      "function count() view returns (uint256)",
      "function increment()",
      "event CountChanged(uint256 newCount, address changedBy)",
    ];

    let provider, contract;

    async function refreshCount() {
      const readOnly = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider);
      const value = await readOnly.count();
      document.getElementById("count").textContent = value.toString();
    }

    document.getElementById("connect").addEventListener("click", async () => {
      if (!window.ethereum) {
        alert("Install MetaMask first.");
        return;
      }
      provider = new ethers.BrowserProvider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      const signer = await provider.getSigner();
      contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
      document.getElementById("increment").disabled = false;
      await refreshCount();
    });

    document.getElementById("increment").addEventListener("click", async () => {
      const tx = await contract.increment();
      await tx.wait();
      await refreshCount();
    });
  </script>
</body>
</html>
