<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter Contract DApp</title>

  <style>
    /* Inline styles guarantee this renders instantly with ZERO network layout shifting */
    body {
      margin: 0;
      padding: 24px;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Style titles to match your production typography guidelines */
    .html-title {
      text-align: center;
      font-size: 2rem;
      font-weight: 800;
      margin: 0 0 8px 0;
      color: #0f172a;
    }

    .html-subtitle {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 600;
      color: #475569;
      margin: 0 0 24px 0;
    }

    /* Matches the exact dimensions of your layout .app-shell container */
    .html-app-shell {
      max-width: 650px;
      min-width: 400px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 40px 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 300px;
    }

    .spinner-element {
      width: 44px;
      height: 44px;
      border: 4px solid #cbd5e1;
      border-bottom-color: #2563eb; /* Premium Light Mode Accent Blue */
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: quick-spin 0.85s linear infinite;
    }

    .loader-text-prompt {
      margin-top: 20px;
      color: #64748b;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    @keyframes quick-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- HTML DOM paints this immediately while the network downloads your JS files -->
    <h1 class="html-title">Counter Contract</h1>
    <h2 class="html-subtitle">(RainbowKit, Wagmi, and Ethers)</h2>
    <div class="html-app-shell">
      <div class="spinner-element"></div>
      <div class="loader-text-prompt">Loading Counter DApp...</div>
    </div>
  </div>

  <!-- The background bundler script. Once loaded, it completely overwrites everything inside #root -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
