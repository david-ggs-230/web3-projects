        <style>
      /* Inline styles ensure the spinner renders instantly before any external CSS files download */
      .initial-loader-wrapper {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        width: 100vw;
        background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        font-family: system-ui, -apple-system, sans-serif;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #cbd5e1;
        border-bottom-color: #2563eb; /* Matches your accent-color blue */
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
      }

      .loader-text {
        margin-top: 16px;
        color: #475569;
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      @keyframes rotation {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Everything inside this div displays immediately, and gets wiped when React boots up -->
      <div class="initial-loader-wrapper">
        <div class="spinner"></div>
        <div class="loader-text">Loading application assets...</div>
      </div>
    </div>

    <!-- The bundle script that replaces the loader when ready -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
